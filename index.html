<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water &amp; Electric Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep: #0f0f1a;
      --bg-panel: #1a1a2e;
      --bg-panel-elevated: #22223a;
      --text-primary: #f0f0f5;
      --text-muted: #8b8ba3;
      --grey-stroke: #5a5a72;
      --electric-yellow: #ffd700;
      --water-blue: #1e90ff;
      --radius-lg: 16px;
      --radius-pill: 50px;
      --transition: 0.4s ease;
      --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .page-header {
      flex-shrink: 0;
      padding: 1.25rem 1.5rem 0.75rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .page-header h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #ffffff 0%, #b8b8d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Top section ── */
    .top-section {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.25rem 1.5rem 0.5rem;
      min-height: 0;
    }

    .control-panel {
      background: linear-gradient(145deg, var(--bg-panel) 0%, var(--bg-panel-elevated) 100%);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 920px;
    }

    .control-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .control-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      width: 100%;
    }

    .status-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      transition: background var(--transition), box-shadow var(--transition);
    }

    .status-icon svg {
      width: 44px;
      height: 44px;
      transition: fill var(--transition), stroke var(--transition), filter var(--transition);
    }

    /* Electricity icon */
    #electricity-icon svg {
      fill: none;
      stroke: var(--grey-stroke);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #electricity-icon.active svg {
      fill: var(--electric-yellow);
      stroke: var(--electric-yellow);
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7))
              drop-shadow(0 0 24px rgba(255, 215, 0, 0.35));
    }

    #electricity-icon.active {
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.25);
    }

    /* Water icon */
    #water-icon svg {
      fill: none;
      stroke: var(--grey-stroke);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Water level: Low */
    #water-icon.level-1 svg {
      fill: var(--water-blue);
      stroke: var(--water-blue);
      filter: drop-shadow(0 0 8px rgba(30, 144, 255, 0.4));
    }

    #water-icon.level-1 {
      box-shadow: 0 0 16px rgba(30, 144, 255, 0.12);
    }

    /* Water level: Medium */
    #water-icon.level-2 svg {
      fill: var(--water-blue);
      stroke: var(--water-blue);
      filter: drop-shadow(0 0 10px rgba(30, 144, 255, 0.55))
              drop-shadow(0 0 20px rgba(30, 144, 255, 0.25));
    }

    #water-icon.level-2 {
      box-shadow: 0 0 22px rgba(30, 144, 255, 0.18);
    }

    /* Water level: High */
    #water-icon.level-3 svg {
      fill: var(--water-blue);
      stroke: var(--water-blue);
      filter: drop-shadow(0 0 12px rgba(30, 144, 255, 0.7))
              drop-shadow(0 0 24px rgba(30, 144, 255, 0.35));
    }

    #water-icon.level-3 {
      box-shadow: 0 0 28px rgba(30, 144, 255, 0.25);
    }

    #water-icon.active svg {
      fill: var(--water-blue);
      stroke: var(--water-blue);
      filter: drop-shadow(0 0 12px rgba(30, 144, 255, 0.7))
              drop-shadow(0 0 24px rgba(30, 144, 255, 0.35));
    }

    #water-icon.active {
      box-shadow: 0 0 28px rgba(30, 144, 255, 0.25);
    }

    .btn-history {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      border: none;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      cursor: pointer;
      text-decoration: none;
      transition: filter var(--transition), transform 0.25s ease, box-shadow var(--transition);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .btn-history:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .btn-history:active {
      transform: translateY(0);
      filter: brightness(1.05);
    }

    .btn-electricity {
      background: linear-gradient(135deg, #4a4520 0%, #6b5f18 40%, #8a7a22 100%);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .btn-electricity:hover {
      box-shadow: 0 6px 24px rgba(255, 215, 0, 0.2);
    }

    .btn-water {
      background: linear-gradient(135deg, #1a2d4a 0%, #1e3d6b 40%, #1e5a8a 100%);
      border: 1px solid rgba(30, 144, 255, 0.25);
    }

    .btn-water:hover {
      box-shadow: 0 6px 24px rgba(30, 144, 255, 0.2);
    }

    /* ── Bottom section ── */
    .bottom-section {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0.35rem 1.5rem 1.5rem;
      min-height: 0;
    }

    .preview-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }

    .image-preview {
      flex: 2;
      min-height: 0;
      background: var(--bg-panel);
      border-radius: var(--radius-lg);
      border: 2px dashed rgba(139, 139, 163, 0.35);
      box-shadow: inset 0 2px 24px rgba(0, 0, 0, 0.4), var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      transition: border-color var(--transition);
    }

    .image-preview:hover {
      border-color: rgba(139, 139, 163, 0.5);
    }

    .image-preview svg {
      width: 64px;
      height: 64px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.5;
      opacity: 0.7;
    }

    .image-preview span {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .image-descriptor {
      flex: 1;
      min-height: 4.5rem;
      background: var(--bg-panel);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(139, 139, 163, 0.2);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-descriptor p {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page-header {
        padding: 1rem 1rem 0.5rem;
      }

      .page-header h1 {
        letter-spacing: 0.1em;
      }

      .top-section {
        padding: 1rem 1rem 0.35rem;
      }

      .bottom-section {
        padding: 0.25rem 1rem 1rem;
      }

      .control-panel {
        padding: 1.5rem 1.25rem;
      }

      .control-stack {
        gap: 1.25rem;
      }

      .control-pair {
        flex-wrap: wrap;
        gap: 1rem;
      }

      .status-icon {
        width: 64px;
        height: 64px;
      }

      .status-icon svg {
        width: 38px;
        height: 38px;
      }

      .control-pair .btn-history {
        flex: 1;
        min-width: 0;
        max-width: 280px;
      }

      .image-preview svg {
        width: 48px;
        height: 48px;
      }

      .image-descriptor {
        min-height: 3.5rem;
        padding: 0.85rem 1rem;
      }

      .image-descriptor p {
        font-size: 0.875rem;
      }
    }

    @media (max-width: 400px) {
      .btn-history {
        font-size: 0.85rem;
        padding: 0.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="page-header">
      <h1>wezo</h1>
    </header>

    <section class="top-section" aria-label="Status controls">
      <div class="control-panel">
        <div class="control-stack">
          <div class="control-pair">
            <div id="electricity-icon" class="status-icon" role="img" aria-label="Electricity status inactive">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
              </svg>
            </div>
            <a href="history-electricity.html" class="btn-history btn-electricity">History Electricity</a>
          </div>
          <div class="control-pair">
            <div id="water-icon" class="status-icon" role="img" aria-label="Water status inactive">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 2.69c-2.5 3.5-6 8.12-6 11.31a6 6 0 0 0 12 0c0-3.19-3.5-7.81-6-11.31z"/>
              </svg>
            </div>
            <a href="history-water.html" class="btn-history btn-water">History Water</a>
          </div>
        </div>
      </div>
    </section>

    <section class="bottom-section" aria-label="Image preview and description">
      <div class="preview-container">
        <div class="image-preview">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Image Preview</span>
        </div>
        <div class="image-descriptor">
          <p>Image descriptor place holder</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    function setElectricityStatus(isActive) {
      const el = document.getElementById('electricity-icon');
      el.classList.toggle('active', Boolean(isActive));
      el.setAttribute('aria-label', isActive ? 'Electricity status active' : 'Electricity status inactive');
    }

    function setWaterStatus(isActive) {
      const el = document.getElementById('water-icon');
      // If isActive is a number (0-3), use it as the water level
      if (typeof isActive === 'number') {
        el.classList.remove('level-1', 'level-2', 'level-3', 'active');
        if (isActive > 0) {
          el.classList.add(`level-${isActive}`);
        }
        const levelNames = ['off', 'low', 'medium', 'high'];
        el.setAttribute('aria-label', `Water level: ${levelNames[isActive]}`);
      } else {
        // Fallback for boolean (for backwards compatibility)
        el.classList.remove('level-1', 'level-2', 'level-3');
        el.classList.toggle('active', Boolean(isActive));
        el.setAttribute('aria-label', isActive ? 'Water status active' : 'Water status inactive');
      }
    }

    window.setElectricityStatus = setElectricityStatus;
    window.setWaterStatus = setWaterStatus;

    const API_BASE = window.location.protocol === 'file:'
      ? 'http://127.0.0.1:8000'
      : window.location.origin;

    async function syncInitialStatus() {
      try {
        const [waterRes, elecRes] = await Promise.all([
          fetch(`${API_BASE}/water/status`),
          fetch(`${API_BASE}/electricity/status`),
        ]);
        if (waterRes.ok) {
          const water = await waterRes.json();
          setWaterStatus(water.status);
        }
        if (elecRes.ok) {
          const elec = await elecRes.json();
          setElectricityStatus(elec.status);
        }
      } catch (err) {
        console.warn('Could not reach backend:', err);
      }
    }

    function connectSSE() {
      const es = new EventSource(`${API_BASE}/events`);
      es.onmessage = async (event) => {
        if (!event.data) return;
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'water') {
            // Fetch current water level when change happens
            try {
              const res = await fetch(`${API_BASE}/water/status`);
              if (res.ok) {
                const water = await res.json();
                setWaterStatus(water.status);
              }
            } catch (err) {
              console.warn('Could not fetch water status:', err);
            }
          }
          if (data.type === 'electricity') setElectricityStatus(data.active);
        } catch (err) {
          console.warn('Invalid SSE payload:', event.data);
        }
      };
      es.onerror = () => console.warn('SSE connection lost — retrying…');
    }

    syncInitialStatus();
    connectSSE();
  </script>
</body>
</html>
